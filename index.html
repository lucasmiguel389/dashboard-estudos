<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">

    <header class="topo">
      <h1>Meus estudos</h1>
      <p>Horas estudadas por tecnologia e por dia</p>
    </header>

    <div class="painel">

      <!-- Coluna da esquerda: formulário e histórico -->
      <aside class="lateral">
        <form id="formulario">
          <h2>Registrar estudo</h2>

          <label class="campo-largo">
            Tecnologia
            <select id="tecnologia">
              <option>HTML</option>
              <option>CSS</option>
              <option>JavaScript</option>
              <option>Python</option>
              <option>Node.js</option>
              <option>Git</option>
              <option>Outra</option>
            </select>
          </label>

          <label>
            Horas
            <input type="number" id="horas" min="0.5" step="0.5" value="1" required>
          </label>

          <label>
            Data
            <input type="date" id="data" required>
          </label>

          <button type="submit" class="campo-largo">Registrar estudo</button>
        </form>

        <section class="historico">
          <h2>Histórico</h2>
          <p id="vazio">Nenhum estudo registrado ainda. Preencha o formulário para começar.</p>
          <ul id="lista"></ul>
        </section>
      </aside>

      <!-- Coluna da direita: cartões e gráficos -->
      <main class="principal">
        <section class="cartoes">
          <div class="cartao cartao-total">
            <span class="cartao-valor" id="total-horas">0</span>
            <span>horas estudadas</span>
          </div>
          <div class="cartao">
            <span class="cartao-valor" id="mais-estudada">-</span>
            <span>tecnologia mais estudada</span>
          </div>
          <div class="cartao">
            <span class="cartao-valor" id="sequencia">0</span>
            <span id="rotulo-sequencia">dias seguidos</span>
          </div>
        </section>

        <section class="graficos">
          <div class="grafico">
            <h2>Horas por tecnologia</h2>
            <div class="caixa-grafico">
              <canvas id="grafico-tecnologias"></canvas>
            </div>
          </div>

          <div class="grafico">
            <h2>Horas por dia</h2>
            <div class="caixa-grafico">
              <canvas id="grafico-dias"></canvas>
            </div>
          </div>
        </section>
      </main>

    </div>
  </div>

  <!-- Chart.js (biblioteca gratuita de gráficos) precisa vir ANTES do nosso script -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Estudos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Meus estudos</h1>

    <!-- Cartão com o total de horas -->
    <section class="total">
      <span id="total-horas">0</span> horas estudadas
    </section>

    <!-- Formulário para registrar uma sessão de estudo -->
    <form id="formulario">
      <label>
        Tecnologia
        <select id="tecnologia">
          <option>HTML</option>
          <option>CSS</option>
          <option>JavaScript</option>
          <option>Python</option>
          <option>Node.js</option>
          <option>Git</option>
          <option>Outra</option>
        </select>
      </label>

      <label>
        Horas
        <input type="number" id="horas" min="0.5" step="0.5" value="1" required>
      </label>

      <label>
        Data
        <input type="date" id="data" required>
      </label>

      <button type="submit">Registrar estudo</button>
    </form>

    <!-- Gráfico de horas por tecnologia -->
    <section class="grafico" id="area-grafico">
      <h2>Horas por tecnologia</h2>
      <div class="caixa-grafico">
        <canvas id="grafico-tecnologias"></canvas>
      </div>
    </section>

    <!-- Gráfico de horas por dia -->
    <section class="grafico" id="area-grafico-linha">
      <h2>Horas por dia</h2>
      <div class="caixa-grafico">
        <canvas id="grafico-dias"></canvas>
      </div>
    </section>

    <!-- Histórico -->
    <h2>Histórico</h2>
    <p id="vazio">Nenhum estudo registrado ainda. Preencha o formulário acima para começar.</p>
    <ul id="lista"></ul>
  </main>

  <!-- Chart.js (biblioteca gratuita de gráficos) precisa vir ANTES do nosso script -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
